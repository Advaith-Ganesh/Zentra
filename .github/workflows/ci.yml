name: CI

on:
  pull_request:
  push:
    branches: [main]

# Never run two builds of the same ref at once.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# Least privilege by default.
permissions:
  contents: read

env:
  PYTHON_VERSION: '3.11'
  NODE_VERSION: '22'

jobs:
  # ---------------------------------------------------------------- backend
  backend:
    name: Backend (tests, lint, types)
    runs-on: ubuntu-latest
    timeout-minutes: 20

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: zentra_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7-alpine
        ports: ['6379:6379']
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10

    env:
      ENVIRONMENT: test
      DEBUG: 'false'
      USE_MOCK_SCANNERS: 'true'
      AUTH_PROVIDER: local
      RATE_LIMIT_ENABLED: 'false'
      LOG_LEVEL: WARNING
      # Ephemeral CI-only values. Not secrets, and never used outside CI.
      JWT_SECRET: ci-only-secret-0000000000000000000000000000000000
      SECRETS_ENCRYPTION_KEY: sHRxYnPTt9EHwSGtQ1c1qE1MMBLNwoFbcHXCoI0uZQY=
      TEST_DATABASE_URL: postgresql+psycopg://postgres:postgres@localhost:5432/zentra_test
      DATABASE_URL: postgresql+psycopg://postgres:postgres@localhost:5432/zentra_test
      REDIS_URL: redis://localhost:6379/0
      CELERY_BROKER_URL: redis://localhost:6379/1
      CELERY_RESULT_BACKEND: redis://localhost:6379/2

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: apps/api/pyproject.toml

      # WeasyPrint needs Pango/Cairo to render the PDF reports.
      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libpango-1.0-0 libpangoft2-1.0-0 libcairo2 \
            libgdk-pixbuf-2.0-0 libffi-dev shared-mime-info

      - name: Install Python dependencies
        working-directory: apps/api
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Lint (ruff)
        working-directory: apps/api
        run: ruff check .

      - name: Format check (ruff)
        working-directory: apps/api
        run: ruff format --check .

      - name: Type check (mypy)
        working-directory: apps/api
        run: mypy zentra

      - name: Apply migrations
        working-directory: apps/api
        run: python -m zentra.db.migrate

      - name: Tests
        working-directory: apps/api
        run: pytest --cov=zentra --cov-report=term-missing --cov-report=xml

      - name: Upload coverage
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-coverage
          path: apps/api/coverage.xml
          if-no-files-found: ignore

  # --------------------------------------------------------------- frontend
  frontend:
    name: Frontend (tests, lint, types, build)
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: apps/web/package-lock.json

      - name: Install dependencies
        working-directory: apps/web
        run: npm ci --no-audit --no-fund

      - name: Lint (eslint)
        working-directory: apps/web
        run: npx eslint src

      - name: Type check (tsc)
        working-directory: apps/web
        run: npx tsc --noEmit

      - name: Tests (vitest)
        working-directory: apps/web
        run: npm test

      - name: Build
        working-directory: apps/web
        env:
          NEXT_TELEMETRY_DISABLED: '1'
        run: npm run build

  # --------------------------------------------------------------- security
  security:
    name: Security checks
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: apps/web/package-lock.json

      - name: Install audit tooling
        run: pip install bandit==1.9.2 pip-audit==2.9.0

      # Static analysis of Zentra's own code. Any medium or high finding fails.
      - name: Static analysis (bandit)
        working-directory: apps/api
        run: bandit -c pyproject.toml -r zentra -ll

      # Known vulnerabilities in Python dependencies, audited against the
      # exact set the API installs.
      - name: Dependency audit (pip-audit)
        working-directory: apps/api
        run: |
          python -m venv .audit-venv
          .audit-venv/bin/pip install --quiet --upgrade pip setuptools
          .audit-venv/bin/pip install --quiet .
          pip-audit --progress-spinner off --skip-editable \
            --path ".audit-venv/lib/python${{ env.PYTHON_VERSION }}/site-packages"

      # Known vulnerabilities in production frontend dependencies.
      - name: Dependency audit (npm)
        working-directory: apps/web
        run: |
          npm ci --no-audit --no-fund
          npm audit --omit=dev --audit-level=moderate

      # Catch a committed secret before it reaches main.
      - name: Secret scan (gitleaks)
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # ----------------------------------------------------------- docker images
  docker:
    name: Docker images build
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3

      - name: Build API image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: infrastructure/docker/api.Dockerfile
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build web image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: infrastructure/docker/web.Dockerfile
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ------------------------------------------------------------------- gate
  # Deployment workflows depend on this job, so a red check blocks a deploy.
  ci-passed:
    name: CI passed
    runs-on: ubuntu-latest
    needs: [backend, frontend, security, docker]
    if: always()
    steps:
      - name: Verify every job succeeded
        run: |
          if [ "${{ contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') }}" = "true" ]; then
            echo "One or more CI jobs failed. Blocking."
            exit 1
          fi
          echo "All CI jobs passed."
