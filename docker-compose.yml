# =============================================================================
# Zentra — local development stack
# =============================================================================
#   docker compose up --build
#
# Brings up Postgres, Redis, the API, a Celery worker, the Celery beat
# scheduler and the Next.js frontend. Migrations run automatically before the
# API starts. Everything runs against mock scanner providers, so no external
# API credentials are needed.
# =============================================================================

name: zentra

x-api-env: &api-env
  ENVIRONMENT: development
  DEBUG: "true"
  LOG_LEVEL: INFO
  LOG_FORMAT: console
  DATABASE_URL: postgresql+psycopg://zentra:zentra@postgres:5432/zentra
  TEST_DATABASE_URL: postgresql+psycopg://zentra:zentra@postgres:5432/zentra_test
  REDIS_URL: redis://redis:6379/0
  CELERY_BROKER_URL: redis://redis:6379/1
  CELERY_RESULT_BACKEND: redis://redis:6379/2
  AUTH_PROVIDER: ${AUTH_PROVIDER:-local}
  # Development-only values. Production supplies real secrets via the platform.
  JWT_SECRET: ${JWT_SECRET:-local-development-secret-change-me-000000000000}
  SECRETS_ENCRYPTION_KEY: ${SECRETS_ENCRYPTION_KEY:-sHRxYnPTt9EHwSGtQ1c1qE1MMBLNwoFbcHXCoI0uZQY=}
  USE_MOCK_SCANNERS: ${USE_MOCK_SCANNERS:-true}
  EMAIL_PROVIDER: ${EMAIL_PROVIDER:-console}
  APP_URL: http://localhost:3000
  API_URL: http://localhost:8000
  CORS_ALLOWED_ORIGINS: http://localhost:3000
  REPORT_STORAGE_DIR: /app/storage/reports
  # Optional provider credentials. Absent by default; the product degrades to
  # "not assessed" rather than failing.
  HIBP_API_KEY: ${HIBP_API_KEY:-}
  SHODAN_API_KEY: ${SHODAN_API_KEY:-}
  NVD_API_KEY: ${NVD_API_KEY:-}
  STRIPE_SECRET_KEY: ${STRIPE_SECRET_KEY:-}
  STRIPE_WEBHOOK_SECRET: ${STRIPE_WEBHOOK_SECRET:-}
  STRIPE_STARTER_PRICE_ID: ${STRIPE_STARTER_PRICE_ID:-}
  STRIPE_GROWTH_PRICE_ID: ${STRIPE_GROWTH_PRICE_ID:-}
  STRIPE_SCALE_PRICE_ID: ${STRIPE_SCALE_PRICE_ID:-}
  STRIPE_REPORT_PACK_PRICE_ID: ${STRIPE_REPORT_PACK_PRICE_ID:-}
  RESEND_API_KEY: ${RESEND_API_KEY:-}
  SUPABASE_URL: ${SUPABASE_URL:-}
  SUPABASE_ANON_KEY: ${SUPABASE_ANON_KEY:-}
  SUPABASE_SERVICE_ROLE_KEY: ${SUPABASE_SERVICE_ROLE_KEY:-}
  SUPABASE_JWT_SECRET: ${SUPABASE_JWT_SECRET:-}
  SLACK_CLIENT_ID: ${SLACK_CLIENT_ID:-}
  SLACK_CLIENT_SECRET: ${SLACK_CLIENT_SECRET:-}
  SLACK_SIGNING_SECRET: ${SLACK_SIGNING_SECRET:-}
  ZENTRA_ADMIN_EMAILS: ${ZENTRA_ADMIN_EMAILS:-}

x-api-build: &api-build
  build:
    context: .
    dockerfile: infrastructure/docker/api.Dockerfile
  volumes:
    - report-storage:/app/storage
  depends_on:
    postgres:
      condition: service_healthy
    redis:
      condition: service_healthy
  restart: unless-stopped

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: zentra
      POSTGRES_PASSWORD: zentra
      POSTGRES_DB: zentra
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./scripts/init-test-db.sh:/docker-entrypoint-initdb.d/10-test-db.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U zentra -d zentra"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--save", "60", "1", "--appendonly", "no"]
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  # Runs once, applies migrations, exits. Everything else waits on it.
  migrate:
    <<: *api-build
    environment: *api-env
    command: ["python", "-m", "zentra.db.migrate"]
    restart: "no"

  api:
    <<: *api-build
    environment: *api-env
    command:
      ["uvicorn", "zentra.main:app", "--host", "0.0.0.0", "--port", "8000"]
    ports:
      - "8000:8000"
    depends_on:
      migrate:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  worker:
    <<: *api-build
    environment: *api-env
    command:
      - celery
      - -A
      - zentra.workers.celery_app:celery_app
      - worker
      - --loglevel=INFO
      - --concurrency=4
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    healthcheck:
      test:
        ["CMD", "celery", "-A", "zentra.workers.celery_app:celery_app", "inspect", "ping", "-d", "celery@$$HOSTNAME"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

  # Scheduled rescans, stuck-scan reaping, benchmark recomputation.
  beat:
    <<: *api-build
    environment: *api-env
    command:
      - celery
      - -A
      - zentra.workers.celery_app:celery_app
      - beat
      - --loglevel=INFO
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy

  web:
    build:
      context: .
      dockerfile: infrastructure/docker/web.Dockerfile
      args:
        NEXT_PUBLIC_API_URL: http://localhost:8000
        NEXT_PUBLIC_APP_URL: http://localhost:3000
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:8000
      NEXT_PUBLIC_APP_URL: http://localhost:3000
    ports:
      - "3000:3000"
    depends_on:
      - api
    restart: unless-stopped

volumes:
  postgres-data:
  redis-data:
  report-storage:
